# Install only this plugin. History composes the already active host services.
# Do NOT disable workspace/session-projection-cache, insert competing service
# providers, or infer capabilities from another package's name.
# Existing explicit user-layer overrides remain the user's responsibility.
#
# Double-mount guard: inspect raw options only. Entry.disabled is a computed
# getter and reading it from another disabled expression can recurse at boot.
#
# The optional subagent spawn provider is resolved at runtime by the subagent
# service; an unavailable optional package must not prevent the host from booting.
- insert:
    - id: dsh-plugin-tool-management
      name: 'dsh-plugin-tool-management'
      disabled: !!js "[...ctx.loader.entries()].some((e) => e.options.id !== 'dsh-plugin-tool-management' && e.options.name === 'dsh-plugin-tool-management' && e.options.disabled !== true && typeof e.options.disabled !== 'object')"
