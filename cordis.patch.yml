# Bundle patch layer for the official CLI install:
#
#   dsh plugin --profile web add dsh-plugin-tool-management@latest
#
# `dsh plugin add` reconciles `dsh.profile.bundles` against installed packages
# and, seeing the `dsh.bundle.patch` declaration in package.json, appends
# `dsh-plugin-tool-management` to the bundle stack. The profile boot then merges
# THIS patch (a single `insert` of the plugin row). No profile file edits
# needed — one command installs and mounts.
#
# Double-mount guard: an aggregate bundle (or a hand-written loader row) may
# already mount this plugin under a different entry id. Two mounts both register the
# /dsh-plugin-tool-management/api route and fail the whole plugin tree at boot
# ("duplicate prefix route"). The `!!js` disabled expression backs THIS row
# off when another *enabled* entry already mounts the plugin; the existing
# instance then owns the API. The loader evaluates the expression at entry
# activation — the full entry tree is composed by then, so user-layer
# (profile cordis.patch.yml) rows are visible too.
#
# ORDER MATTERS — do not move `!e.disabled` ahead of the id/name checks.
# `Entry.disabled` is an uncached getter that re-evaluates the expression,
# so touching `e.disabled` of THIS entry re-enters this very expression
# (infinite recursion → "Maximum call stack size exceeded" at boot). The
# `id !==` check short-circuits on our own row and the `name` check
# short-circuits on every unrelated entry (e.g. dsh-better-sidebar's own
# guard), so `!e.disabled` is only ever read on a genuinely matching
# legacy/aggregate row (a plain boolean, no re-entry).
# 折叠 dsh-archive-manager：替换官方 workspace 与 session-projection-cache
# 服务为归档感知子类（永久删除 + unarchive + 批量 + archivedAt 保留期账本）。
# 官方 ui-workspace 保持启用；归档菜单仍由官方 UI 提供，删除/恢复/保留期
# 由本插件的 TOOLS → History 页面经 HTTP API 驱动。
#
# 冲突告警：不要同时安装独立的 @michengai/dsh-archive-manager——两个补丁都
# 禁用官方 workspace 行并插入替换，会导致重复服务注册、启动失败。
#
# spawn provider（子智能体）挂载：本文件**故意不**插入
# `@deepseek-ai/dsh-subagent-spawn-in-process` 行。取舍理由：
#   1) insert 行在启动期解析：换台没有该包的宿主会因单行加载失败拖垮整棵插件树，
#      而缺 provider 时受影响面只有一个 subagent_run 调用；
#   2) 该行与本插件运行时的 ctx.plugin 兜底挂载存在双挂载窗口（同名 provider 重复注册）。
# 改由 src/subagents/service.ts 走官方通道：ctx.subagents.list() 探测到 spawn 即跳过；
# 缺失才经 createRequire + apply(ctx, {providerName:'spawn'}) 挂载；失败把原因原样抛给模型。
# 该包在 package.json 声明为**可选** peerDependency（peerDependenciesMeta.optional）——
# 宿主/profile 自带时可以照常挂载。设计 §3.2 字面要求「挂载声明进 cordis.patch.yml」，
# 这里按上述风险裁定为有意偏离（记录见 docs/审查/2026-09-13-场景档案v2双轴评审.md）。
- id: workspace
  disabled: true
- id: session-projection-cache
  disabled: true
- insert:
    - id: dsh-plugin-tool-management
      name: 'dsh-plugin-tool-management'
      disabled: !!js "[...ctx.loader.entries()].some((e) => e.options.id !== 'dsh-plugin-tool-management' && e.options.name === 'dsh-plugin-tool-management' && !e.disabled)"
    - id: workspace-tool-management-history
      name: 'dsh-plugin-tool-management/workspace'
    - id: session-projection-cache-tool-management-history
      name: 'dsh-plugin-tool-management/projcache'
      config:
        writeEveryEvents: 200
        writeIntervalMs: 5000
