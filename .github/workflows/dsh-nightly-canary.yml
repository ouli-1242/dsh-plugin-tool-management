# 每日宿主对表：拿「插件声明支持的那一代宿主」跑一遍插件侧的全部硬检查。
#
# 为什么不用「发版前手动跑」：官方 rc 的节奏比本插件的发版快，等到发版才发现契约变了，
# 用户已经先装上了。这里每天自动把「宿主 × 本插件」量一遍：
#   - 能力探测缺项（doctor blocker）→ 开 issue；
#   - 契约测试 / 构建失败 → 同一标题的 issue 追加一条评论；
#   - 恢复通过 → 自动关闭该 issue。
#
# 宿主版本怎么挑：**不跟 npm 的 `latest` 标签**。`latest` 是官方推荐给最终用户的那一版，
# 而插件适配的常常是刚发到 `next` 的下一代 —— 拿旧宿主去量新代码，host-deps 会报 SKEW
# 直接红，红得没有信息量（0.2.2-rc.1 那一代就是这样）。
# 现在按 `package.json` 的 `engines.dsh` 解析：取**已发布版本里最新的非预览版**
# （排除 alpha / beta，它们的版本号大概率超出当前范围，天天红没有信息量），
#   - 落在声明范围内 → 装它，跑全套检查；
#   - 落在范围外 → 失败，这才是「官方发了新一代，该适配了」的信号。
# 想提前看 alpha 或钉某一版，用 workflow_dispatch 的 version 输入。
#
# 跑在 windows-latest：本插件的主战场是桌面 Windows，契约测试里也有依赖 Windows 临时
# 目录可读性的用例（Linux runner 的 /tmp 下有不可读目录，会误报）。bash 步骤统一用
# Git Bash（defaults.run.shell），保证与本地脚本同一套写法。

name: DSH nightly canary

on:
  schedule:
    # 每天 02:17 UTC。避开整点，减少 GitHub 调度拥堵。
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 指定宿主版本（留空 = 按 engines.dsh 自动解析）
        required: false
        type: string

permissions:
  contents: read
  issues: write

jobs:
  canary:
    name: host declared
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install plugin dependencies
        run: npm ci --no-audit --no-fund

      - name: Install DSH host
        id: host
        env:
          # 走 env 而不是直接插值：dispatch 的输入是自由文本，拼进 shell 会变成注入面。
          HOST_VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          PREFIX="$RUNNER_TEMP/dsh-host"
          # Git Bash 下统一成正斜杠混合路径，后面的 node -e 才能直接拼进 JS 字符串。
          if command -v cygpath >/dev/null 2>&1; then PREFIX="$(cygpath -m "$RUNNER_TEMP")/dsh-host"; fi
          mkdir -p "$PREFIX"

          # 仓库是 `"type": "module"`，`node -e` 同样按 ESM 求值：这里一律用 import，不用 require。
          RANGE=$(node -e 'import { readFileSync } from "node:fs"; console.log(JSON.parse(readFileSync("package.json", "utf8")).engines.dsh)')
          echo "range=$RANGE" >> "$GITHUB_OUTPUT"
          echo "declared range: $RANGE"

          VERSION="${HOST_VERSION_INPUT:-}"
          if [ -z "$VERSION" ]; then
            if ! npm view @deepseek-ai/dsh versions --json > "$PREFIX/versions.json"; then
              echo '查询 npm 上 @deepseek-ai/dsh 的版本列表失败（网络或 registry 不可达）。' > doctor.txt
              exit 1
            fi
            # 解析失败时把原因写进 doctor.txt —— 报告失败的步骤只读这个文件。
            VERSION=$(VERSIONS_JSON="$PREFIX/versions.json" node -e '
              import { readFileSync } from "node:fs"
              import semver from "semver"
              const range = JSON.parse(readFileSync("package.json", "utf8")).engines.dsh
              const raw = JSON.parse(readFileSync(process.env.VERSIONS_JSON, "utf8"))
              const all = Array.isArray(raw) ? raw : [raw]
              const preview = (v) => (semver.prerelease(v) || []).some((p) => p === "alpha" || p === "beta")
              const usable = all.filter((v) => semver.valid(v) && !preview(v))
              const newest = usable.slice().sort(semver.rcompare)[0]
              const matching = usable.filter((v) => semver.satisfies(v, range))
              if (newest === undefined) {
                console.error("[canary] npm 上没有可用的非预览宿主版本")
                process.exit(3)
              }
              if (!semver.satisfies(newest, range)) {
                console.error(
                  `[canary] 最新的非预览宿主 ${newest} 不在插件声明的 \`${range}\` 内。` +
                  `本代可用版本：${matching.join(", ") || "(无)"}。` +
                  "若这是官方新一代，先按 AGENTS.md「适配新一代宿主」改范围；若只是发布顺序问题，忽略本行。",
                )
                process.exit(3)
              }
              console.log(newest)
            ' 2>"$PREFIX/resolve-error.txt") || {
              { echo '宿主版本解析失败：'; cat "$PREFIX/resolve-error.txt"; } > doctor.txt
              exit 1
            }
          fi

          cd "$PREFIX"
          npm init -y >/dev/null
          npm install --no-audit --no-fund --no-save "@deepseek-ai/dsh@$VERSION"
          # npm 可能把宿主依赖平铺到顶层，也可能套在 dsh 自己的 node_modules 下；
          # 两种形态都认，交给 host-deps 的同一份形状判定。
          NESTED="$PREFIX/node_modules/@deepseek-ai/dsh/node_modules/@deepseek-ai"
          OUTER="$PREFIX/node_modules/@deepseek-ai"
          if [ -f "$NESTED/cordis/package.json" ]; then HOST_DIR="$NESTED"; else HOST_DIR="$OUTER"; fi
          test -f "$HOST_DIR/cordis/package.json"

          # 用 import 而不是 require：这一步的 cwd 在临时宿主目录下，不该赌那里有没有 type 字段。
          INSTALLED=$(node -e 'import { readFileSync } from "node:fs"; console.log(JSON.parse(readFileSync("node_modules/@deepseek-ai/dsh/package.json", "utf8")).version)')
          if [ "$INSTALLED" != "$VERSION" ]; then
            echo "::error::installed $INSTALLED but resolved $VERSION"
            exit 1
          fi
          echo "resolved range $RANGE -> $INSTALLED at $HOST_DIR"
          echo "dir=$HOST_DIR" >> "$GITHUB_OUTPUT"
          echo "version=$INSTALLED" >> "$GITHUB_OUTPUT"

      - name: Compile plugin for host tooling
        # host-deps.mjs 直接 import 编译产物里的宿主发现逻辑（全仓同一份口径）。
        # 完整 build 要等对齐宿主之后才能跑（它按宿主类型检查），所以先用锁文件里的
        # devDeps 编译一遍，只为让脚本有 lib/ 可用。
        run: npx tsc -p tsconfig.json

      - name: Align plugin host packages
        run: node scripts/host-deps.mjs --fix --host "${{ steps.host.outputs.dir }}"

      - name: Build
        run: npm run build

      - name: Contract tests
        run: node --test test/contracts.test.mjs

      - name: Doctor
        run: |
          set -o pipefail
          node scripts/doctor.mjs 2>&1 | tee doctor.txt

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: Canary failed for DSH host
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          SIG=$( { tail -60 doctor.txt 2>/dev/null || echo 'no doctor output'; } | sha256sum | cut -c1-12)
          BODY=$(printf 'DSH `%s` (declared range `%s`) canary failed.\n\nRun: %s\n\n```\n%s\n```\n\nsig: %s\n' \
            "${{ steps.host.outputs.version }}" "${{ steps.host.outputs.range }}" "$RUN_URL" \
            "$(tail -80 doctor.txt 2>/dev/null || echo 'no doctor output (an earlier step failed)')" \
            "$SIG")
          NUM=$(gh issue list --state open --limit 100 --json number,title \
            --jq ".[] | select(.title == \"$TITLE\") | .number" | head -1)
          if [ -n "$NUM" ]; then
            # 同一个失败签名不重复评论：issue 里保留首次现场，后续只在失败形态变化时追加。
            SEEN=$(gh issue view "$NUM" --json comments --jq '[.comments[].body] | join("\n")')
            if printf '%s' "$SEEN" | grep -q "sig: $SIG"; then
              echo "same failure signature (sig: $SIG); issue #$NUM already up to date"
            else
              gh issue comment "$NUM" --body "$BODY"
            fi
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi

      - name: Close recovered issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: Canary failed for DSH host
        run: |
          set -euo pipefail
          NUM=$(gh issue list --state open --limit 100 --json number,title \
            --jq ".[] | select(.title == \"$TITLE\") | .number" | head -1)
          if [ -n "$NUM" ]; then
            gh issue close "$NUM" --comment "Recovered: the nightly canary passes against DSH ${{ steps.host.outputs.version }}."
          fi
